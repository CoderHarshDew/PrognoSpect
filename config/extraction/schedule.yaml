# CSE-CIC-IDS2018 official attack schedule — transcribed from "Table 2: List of
# daily attacks, Machine IPs, Start and finish time of attack(s)".
#
# Source: https://www.unb.ca/cic/datasets/ids-2018.html  ("CSE-CIC-IDS2018 on AWS")
# Retrieved: 2026-09-19
#
# This file is meant to be used fully offline. There is no separate downloadable
# machine-readable version of the schedule — the source is a static HTML table
# with no port or protocol columns, so this transcription is the authoritative
# local copy going forward. Cross-check it once against a known-attack PCAP
# before trusting it at the minute/IP-form level (see caveats 1 and 4).
#
# CAVEATS — read before wiring this into the labeller:
#
#   1. protocol_hint / port_hint are OUR inference from the attack tool/name,
#      NOT part of the official schedule (which has no such columns).
#        confidence: high   -> safe to filter on protocol/port
#        confidence: medium -> usable but soft (single tool, multi-target-capable)
#        confidence: low    -> do NOT filter on protocol/port; match on
#                               attacker/victim IP + time window only
#
#   2. The source table lists the second Thursday-01-03-2018 Infiltration entry
#      (14:00-15:37) TWICE, identically. Collapsed to one entry here (id: 20).
#
#   3. Source row for DoS-GoldenEye has a typo, "Vazlid IP" for the attacker's
#      public address — normalized to "Valid IP" / attacker_ips here.
#
#   4. IP-address asymmetry (important for matching against your captured PCAPs):
#      - ids 1-6 (Bruteforce/DoS): BOTH the attacker's internal-AWS address
#        (172.31.x.x) and its public "Valid IP" are given in the source table.
#      - ids 7-22 (DDoS/Web/Infiltration/Bot): only the attacker's PUBLIC
#        address is published in the source table — no internal-AWS form
#        exists for these, because these attackers were never inside the VPC.
#        This is expected, not a transcription gap.
#      - Victim addresses are given in both internal and public form for every
#        row and both are listed under victim_ips.
#      - Which form (public vs internal) actually appears in your merged CSV
#        depends on where inside AWS your PCAPs were captured — verify against
#        one known-attack window before assuming either form is absent.
#
#   5. Multi-target rows are stored as lists and use YAML anchors/aliases to
#      avoid re-typing the same 10-IP set across sibling rows on the same day:
#        - DDoS attacks (ids 7-10): 10 attacker IPs -> 1 victim
#        - Bot (ids 21-22): 1 attacker -> 10 victim IPs
#      Matching should be "IP in list", never a single-pair equality check.
#
#   6. Times are local to the original capture; the source page does not state
#      a timezone. Treat as naive local time consistent with your PCAP
#      timestamps and re-verify boundary minutes against real traffic before
#      trusting them at high precision (per the LycoStand paper, the official
#      CIC-IDS2017 schedule needed manual Wireshark-based time correction —
#      untested here for 2018, deliberately deferred per your ASAP-deadline call).

