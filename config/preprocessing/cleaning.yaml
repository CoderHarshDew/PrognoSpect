version: 1.0

settings:

  generate_report: true
  preserve_original_dataset: true
  revalidate: true


formulas:

  flow_bytes_per_second:

    expression: >
      (
        TotLen Fwd Pkts +
        TotLen Bwd Pkts
      ) /
      (
        Flow Duration / 1000000
      )

    requires:
      - TotLen Fwd Pkts
      - TotLen Bwd Pkts
      - Flow Duration

  flow_packets_per_second:

    expression: >
      (
        Tot Fwd Pkts +
        Tot Bwd Pkts
      ) /
      (
        Flow Duration / 1000000
      )

    requires:
      - Tot Fwd Pkts
      - Tot Bwd Pkts
      - Flow Duration


repairable:

  Flow Byts/s:
    formula: flow_bytes_per_second

  Flow Pkts/s:
    formula: flow_packets_per_second


non_repairable:

  - Dst Port
  - Protocol
  - Timestamp
  - Flow Duration

  - Tot Fwd Pkts
  - Tot Bwd Pkts

  - TotLen Fwd Pkts
  - TotLen Bwd Pkts

  - Fwd Pkt Len Max
  - Fwd Pkt Len Min
  - Fwd Pkt Len Mean
  - Fwd Pkt Len Std

  - Bwd Pkt Len Max
  - Bwd Pkt Len Min
  - Bwd Pkt Len Mean
  - Bwd Pkt Len Std

  - Flow IAT Mean
  - Flow IAT Std
  - Flow IAT Max
  - Flow IAT Min

  - Fwd IAT Tot
  - Fwd IAT Mean
  - Fwd IAT Std
  - Fwd IAT Max
  - Fwd IAT Min

  - Bwd IAT Tot
  - Bwd IAT Mean
  - Bwd IAT Std
  - Bwd IAT Max
  - Bwd IAT Min

  - Fwd Header Len
  - Bwd Header Len

  - Fwd Pkts/s
  - Bwd Pkts/s

  - Pkt Len Min
  - Pkt Len Max
  - Pkt Len Mean
  - Pkt Len Std
  - Pkt Len Var

  - FIN Flag Cnt
  - SYN Flag Cnt
  - RST Flag Cnt
  - PSH Flag Cnt
  - ACK Flag Cnt
  - URG Flag Cnt
  - ECE Flag Cnt

  - Down/Up Ratio

  - Pkt Size Avg

  - Init Fwd Win Byts
  - Init Bwd Win Byts

  - Fwd Act Data Pkts
  - Fwd Seg Size Min

  - Active Mean
  - Active Std
  - Active Max
  - Active Min

  - Idle Mean
  - Idle Std
  - Idle Max
  - Idle Min

  - Label


columns_to_drop:

  - Bwd PSH Flags
  - Fwd URG Flags
  - Bwd URG Flags
  - CWE Flag Count

  - Fwd Byts/b Avg
  - Fwd Pkts/b Avg
  - Fwd Blk Rate Avg

  - Bwd Byts/b Avg
  - Bwd Pkts/b Avg
  - Bwd Blk Rate Avg

  - Subflow Fwd Pkts
  - Subflow Bwd Pkts
  - Subflow Fwd Byts
  - Fwd Seg Size Avg
  - Bwd Seg Size Avg
