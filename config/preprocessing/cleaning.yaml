version: 2.0

settings:

  generate_report: true
  preserve_original_dataset: true
  revalidate: true


formulas:

  flow_bytes_per_second:

    expression: >
      (
        Total Length of Fwd Packets +
        Total Length of Bwd Packets
      ) /
      (
        Flow Duration / 1000000
      )

    requires:
      - Total Length of Fwd Packets
      - Total Length of Bwd Packets
      - Flow Duration

  flow_packets_per_second:

    expression: >
      (
        Total Fwd Packets +
        Total Bwd Packets
      ) /
      (
        Flow Duration / 1000000
      )

    requires:
      - Total Fwd Packets
      - Total Bwd Packets
      - Flow Duration

  fwd_packets_per_second:

    expression: >
      Total Fwd Packets /
      (
        Flow Duration / 1000000
      )

    requires:
      - Total Fwd Packets
      - Flow Duration

  bwd_packets_per_second:

    expression: >
      Total Bwd Packets /
      (
        Flow Duration / 1000000
      )

    requires:
      - Total Bwd Packets
      - Flow Duration

  down_up_ratio:

    expression: >
      Total Bwd Packets /
      Total Fwd Packets

    requires:
      - Total Bwd Packets
      - Total Fwd Packets

  packet_length_variance:

    expression: >
      Packet Length Std ** 2

    requires:
      - Packet Length Std

  tcp_window_fwd_mean_sign_correction:

    expression: >
      TCP Window Fwd Mean + 65536

    requires:
      - TCP Window Fwd Mean

  tcp_window_fwd_std_sign_correction:

    expression: >
      TCP Window Fwd Std + 65536

    requires:
      - TCP Window Fwd Std

  tcp_window_fwd_min_sign_correction:

    expression: >
      TCP Window Fwd Min + 65536

    requires:
      - TCP Window Fwd Min

  tcp_window_fwd_max_sign_correction:

    expression: >
      TCP Window Fwd Max + 65536

    requires:
      - TCP Window Fwd Max

  tcp_window_bwd_mean_sign_correction:

    expression: >
      TCP Window Bwd Mean + 65536

    requires:
      - TCP Window Bwd Mean

  tcp_window_bwd_std_sign_correction:

    expression: >
      TCP Window Bwd Std + 65536

    requires:
      - TCP Window Bwd Std

  tcp_window_bwd_min_sign_correction:

    expression: >
      TCP Window Bwd Min + 65536

    requires:
      - TCP Window Bwd Min

  tcp_window_bwd_max_sign_correction:

    expression: >
      TCP Window Bwd Max + 65536

    requires:
      - TCP Window Bwd Max

  payload_min_sentinel_zero:

    expression: >
      Payload Min * 0

    requires:
      - Payload Min

  payload_p25_sentinel_zero:

    expression: >
      Payload P25 * 0

    requires:
      - Payload P25


repairable:

  Flow Bytes/s:
    formula: flow_bytes_per_second

  Flow Packets/s:
    formula: flow_packets_per_second

  Fwd Packets/s:
    formula: fwd_packets_per_second

  Bwd Packets/s:
    formula: bwd_packets_per_second

  Down/Up Ratio:
    formula: down_up_ratio

  Packet Length Variance:
    formula: packet_length_variance

  TCP Window Fwd Mean:
    formula: tcp_window_fwd_mean_sign_correction

  TCP Window Fwd Std:
    formula: tcp_window_fwd_std_sign_correction

  TCP Window Fwd Min:
    formula: tcp_window_fwd_min_sign_correction

  TCP Window Fwd Max:
    formula: tcp_window_fwd_max_sign_correction

  TCP Window Bwd Mean:
    formula: tcp_window_bwd_mean_sign_correction

  TCP Window Bwd Std:
    formula: tcp_window_bwd_std_sign_correction

  TCP Window Bwd Min:
    formula: tcp_window_bwd_min_sign_correction

  TCP Window Bwd Max:
    formula: tcp_window_bwd_max_sign_correction

  Payload Min:
    formula: payload_min_sentinel_zero

  Payload P25:
    formula: payload_p25_sentinel_zero


