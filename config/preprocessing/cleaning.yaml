settings:

  generate_report: true
  preserve_original_dataset: true
  revalidate: true


formulas:

  flow_bytes_per_second:

    expression: >
      (
        Total Length of Fwd Packets +
        Total Length of Bwd Packets
      ) /
      (
        Flow Duration / 1000000
      )

    requires:
      - Total Length of Fwd Packets
      - Total Length of Bwd Packets
      - Flow Duration

  flow_packets_per_second:

    expression: >
      (
        Total Fwd Packets +
        Total Bwd Packets
      ) /
      (
        Flow Duration / 1000000
      )

    requires:
      - Total Fwd Packets
      - Total Bwd Packets
      - Flow Duration

  fwd_packets_per_second:

    expression: >
      Total Fwd Packets /
      (
        Flow Duration / 1000000
      )

    requires:
      - Total Fwd Packets
      - Flow Duration

  bwd_packets_per_second:

    expression: >
      Total Bwd Packets /
      (
        Flow Duration / 1000000
      )

    requires:
      - Total Bwd Packets
      - Flow Duration

  avg_fwd_segment_size:

    expression: >
      Total Length of Fwd Packets /
      Total Fwd Packets

    requires:
      - Total Length of Fwd Packets
      - Total Fwd Packets

  avg_bwd_segment_size:

    expression: >
      Total Length of Bwd Packets /
      Total Bwd Packets

    requires:
      - Total Length of Bwd Packets
      - Total Bwd Packets

  down_up_ratio:

    expression: >
      Total Bwd Packets /
      Total Fwd Packets

    requires:
      - Total Bwd Packets
      - Total Fwd Packets

  packet_length_variance:

    expression: >
      Packet Length Std ** 2

    requires:
      - Packet Length Std

  fwd_header_length_duplicate:

    expression: >
      Fwd Header Length

    requires:
      - Fwd Header Length


repairable:

  Flow Bytes/s:
    formula: flow_bytes_per_second

  Flow Packets/s:
    formula: flow_packets_per_second

  Fwd Packets/s:
    formula: fwd_packets_per_second

  Bwd Packets/s:
    formula: bwd_packets_per_second

  Avg Fwd Segment Size:
    formula: avg_fwd_segment_size

  Avg Bwd Segment Size:
    formula: avg_bwd_segment_size

  Down/Up Ratio:
    formula: down_up_ratio

  Packet Length Variance:
    formula: packet_length_variance

  Fwd Header Length.1:
    formula: fwd_header_length_duplicate


