version: 1.0

templates:

  positive_uint16: &positive_uint16
    dtype: uint16
    validation:
      allow_negative: false
      allow_inf: false
      allow_nan: false
      minimum: 0
      maximum: 65535
      sentinel: []

  positive_uint32: &positive_uint32
    dtype: uint32
    validation:
      allow_negative: false
      allow_inf: false
      allow_nan: false
      minimum: 0
      maximum: null
      sentinel: []

  positive_uint64: &positive_uint64
    dtype: uint64
    validation:
      allow_negative: false
      allow_inf: false
      allow_nan: false
      minimum: 0
      maximum: null
      sentinel: []

  positive_float: &positive_float
    dtype: float64
    validation:
      allow_negative: false
      allow_inf: false
      allow_nan: true
      minimum: 0
      maximum: null
      sentinel: []

  packet_length: &packet_length
    dtype: float64
    validation:
      allow_negative: false
      allow_inf: false
      allow_nan: true
      minimum: 0
      maximum: 65535
      sentinel: []

  packet_length_variance: &packet_length_variance
    dtype: float64
    validation:
      allow_negative: false
      allow_inf: false
      allow_nan: true
      minimum: 0
      maximum: null
      sentinel: []

  tcp_window: &tcp_window
    dtype: int32
    validation:
      allow_negative: false
      allow_inf: false
      allow_nan: false
      minimum: 0
      maximum: 65535
      sentinel: [-1]


numeric_col:

  - Dst Port
  - Protocol
  - Flow Duration
  - Tot Fwd Pkts
  - Tot Bwd Pkts
  - TotLen Fwd Pkts
  - TotLen Bwd Pkts
  - Fwd Pkt Len Max
  - Fwd Pkt Len Min
  - Fwd Pkt Len Mean
  - Fwd Pkt Len Std
  - Bwd Pkt Len Max
  - Bwd Pkt Len Min
  - Bwd Pkt Len Mean
  - Bwd Pkt Len Std
  - Flow Byts/s
  - Flow Pkts/s
  - Flow IAT Mean
  - Flow IAT Std
  - Flow IAT Max
  - Flow IAT Min
  - Fwd IAT Tot
  - Fwd IAT Mean
  - Fwd IAT Std
  - Fwd IAT Max
  - Fwd IAT Min
  - Bwd IAT Tot
  - Bwd IAT Mean
  - Bwd IAT Std
  - Bwd IAT Max
  - Bwd IAT Min
  - Fwd PSH Flags
  - Fwd Header Len
  - Bwd Header Len
  - Fwd Pkts/s
  - Bwd Pkts/s
  - Pkt Len Min
  - Pkt Len Max
  - Pkt Len Mean
  - Pkt Len Std
  - Pkt Len Var
  - FIN Flag Cnt
  - SYN Flag Cnt
  - RST Flag Cnt
  - PSH Flag Cnt
  - ACK Flag Cnt
  - URG Flag Cnt
  - ECE Flag Cnt
  - Down/Up Ratio
  - Pkt Size Avg
  - Fwd Seg Size Min
  - Init Fwd Win Byts
  - Init Bwd Win Byts
  - Fwd Act Data Pkts
  - Active Mean
  - Active Std
  - Active Max
  - Active Min
  - Idle Mean
  - Idle Std
  - Idle Max
  - Idle Min


non_numeric_col:

  - Timestamp
  - Label


feature_groups:

  packet_counts:
    template: *positive_uint32
    unit: packet
    features:
      - Tot Fwd Pkts
      - Tot Bwd Pkts
      - Fwd Act Data Pkts

  byte_counts:
    template: *positive_uint64
    unit: byte
    features:
      - TotLen Fwd Pkts
      - TotLen Bwd Pkts
      - Fwd Header Len
      - Bwd Header Len

  iat_statistics:
    template: *positive_float
    unit: microsecond
    features:
      - Flow IAT Mean
      - Flow IAT Std
      - Fwd IAT Mean
      - Fwd IAT Std
      - Bwd IAT Mean
      - Bwd IAT Std
      - Active Mean
      - Active Std
      - Idle Mean
      - Idle Std

  iat_totals:
    template: *positive_uint64
    unit: microsecond
    features:
      - Flow Duration
      - Flow IAT Max
      - Flow IAT Min
      - Fwd IAT Tot
      - Fwd IAT Max
      - Fwd IAT Min
      - Bwd IAT Tot
      - Bwd IAT Max
      - Bwd IAT Min
      - Active Max
      - Active Min
      - Idle Max
      - Idle Min

  packet_lengths:
    template: *packet_length
    unit: byte
    features:
      - Fwd Pkt Len Max
      - Fwd Pkt Len Min
      - Fwd Pkt Len Mean
      - Fwd Pkt Len Std
      - Bwd Pkt Len Max
      - Bwd Pkt Len Min
      - Bwd Pkt Len Mean
      - Bwd Pkt Len Std
      - Pkt Len Min
      - Pkt Len Max
      - Pkt Len Mean
      - Pkt Len Std
      - Pkt Size Avg

  packet_length_variance:
    template: *packet_length_variance
    unit: byte
    features:
      - Pkt Len Var

  rates:
    template: *positive_float
    unit: rate
    features:
      - Flow Byts/s
      - Flow Pkts/s
      - Fwd Pkts/s
      - Bwd Pkts/s
      - Down/Up Ratio

  tcp_windows:
    template: *tcp_window
    unit: byte
    features:
      - Init Fwd Win Byts
      - Init Bwd Win Byts
      - Fwd Seg Size Min

  tcp_flag_counts:
    template: *positive_uint32
    unit: count
    features:
      - Fwd PSH Flags
      - FIN Flag Cnt
      - SYN Flag Cnt
      - RST Flag Cnt
      - PSH Flag Cnt
      - ACK Flag Cnt
      - URG Flag Cnt
      - ECE Flag Cnt


features:

  Dst Port:
    <<: *positive_uint16
    unit: port

  Protocol:
    <<: *positive_uint32
    unit: protocol

  Timestamp:
    dtype: string
    unit: timestamp
    validation:
      allow_nan: false

  Label:
    dtype: category
    unit: label
    validation: {}
