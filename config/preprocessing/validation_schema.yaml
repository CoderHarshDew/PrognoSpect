templates:

  non_negative_integer: &non_negative_integer
    dtype: Int64
    validation:
      allow_negative: false
      allow_inf: false
      allow_nan: false
      minimum: 0
      maximum: null
      sentinel: []

  non_negative_float: &non_negative_float
    dtype: float64
    validation:
      allow_negative: false
      allow_inf: false
      allow_nan: true
      minimum: 0
      maximum: null
      sentinel: []

  packet_length: &packet_length
    dtype: float64
    validation:
      allow_negative: false
      allow_inf: false
      allow_nan: true
      minimum: 0
      maximum: 65535
      sentinel: []

  packet_length_variance: &packet_length_variance
    dtype: float64
    validation:
      allow_negative: false
      allow_inf: false
      allow_nan: true
      minimum: 0
      maximum: null
      sentinel: []

  tcp_window: &tcp_window
    dtype: Int64
    validation:
      allow_negative: true
      allow_inf: false
      allow_nan: false
      minimum: 0
      maximum: 65535
      sentinel: [-1]

  tcp_window_float: &tcp_window_float
    dtype: float64
    validation:
      allow_negative: true
      allow_inf: false
      allow_nan: true
      minimum: 0
      maximum: 65535
      sentinel: [-1]

  ttl_float: &ttl_float
    dtype: float64
    validation:
      allow_negative: true
      allow_inf: false
      allow_nan: true
      minimum: 0
      maximum: 255
      sentinel: [-1]

  ttl_int: &ttl_int
    dtype: Int64
    validation:
      allow_negative: true
      allow_inf: false
      allow_nan: false
      minimum: 0
      maximum: 255
      sentinel: [-1]

  ratio_0_1: &ratio_0_1
    dtype: float64
    validation:
      allow_negative: false
      allow_inf: false
      allow_nan: true
      minimum: 0
      maximum: 1
      sentinel: []

  payload_int: &payload_int
    dtype: Int64
    validation:
      allow_negative: false
      allow_inf: false
      allow_nan: false
      minimum: 0
      maximum: 65535
      sentinel: []


non_numeric_col:
  - Flow ID
  - Source IP
  - Destination IP
  - Timestamp
  - Label


feature_groups:

  ports:
    template: *non_negative_integer
    unit: port
    features:
      - Source Port
      - Destination Port

  protocol:
    template: *non_negative_integer
    unit: protocol
    features:
      - Protocol

  packet_counts:
    template: *non_negative_integer
    unit: packet
    features:
      - Total Fwd Packets
      - Total Bwd Packets
      - act_data_pkt_fwd
      - Subflow Fwd Packets
      - Subflow Bwd Packets

  byte_counts:
    template: *non_negative_integer
    unit: byte
    features:
      - Total Length of Fwd Packets
      - Total Length of Bwd Packets
      - Fwd Header Length
      - Bwd Header Length
      - Fwd Header Length.1
      - Subflow Fwd Bytes
      - Subflow Bwd Bytes

  iat_statistics:
    template: *non_negative_float
    unit: microsecond
    features:
      - Flow IAT Mean
      - Flow IAT Std
      - Fwd IAT Mean
      - Fwd IAT Std
      - Bwd IAT Mean
      - Bwd IAT Std
      - Active Mean
      - Active Std
      - Idle Mean
      - Idle Std

  iat_totals:
    template: *non_negative_integer
    unit: microsecond
    features:
      - Flow Duration
      - Flow IAT Max
      - Flow IAT Min
      - Fwd IAT Total
      - Fwd IAT Max
      - Fwd IAT Min
      - Bwd IAT Total
      - Bwd IAT Max
      - Bwd IAT Min
      - Active Max
      - Active Min
      - Idle Max
      - Idle Min

  packet_lengths:
    template: *packet_length
    unit: byte
    features:
      - Fwd Packet Length Max
      - Fwd Packet Length Min
      - Fwd Packet Length Mean
      - Fwd Packet Length Std
      - Bwd Packet Length Max
      - Bwd Packet Length Min
      - Bwd Packet Length Mean
      - Bwd Packet Length Std
      - Packet Length Min
      - Packet Length Max
      - Packet Length Mean
      - Packet Length Std
      - Average Packet Size
      - Avg Fwd Segment Size
      - Avg Bwd Segment Size

  packet_length_variance:
    template: *packet_length_variance
    unit: byte
    features:
      - Packet Length Variance

  rates:
    template: *non_negative_float
    unit: rate
    features:
      - Flow Bytes/s
      - Flow Packets/s
      - Fwd Packets/s
      - Bwd Packets/s
      - Down/Up Ratio
      - dst_port_scan_rate
      - src_dst_pair_flow_rate

  tcp_windows:
    template: *tcp_window
    unit: byte
    features:
      - Init_Win_bytes_forward
      - Init_Win_bytes_backward
      - min_seg_size_forward

  tcp_flag_counts:
    template: *non_negative_integer
    unit: count
    features:
      - Fwd PSH Flags
      - Bwd PSH Flags
      - Fwd URG Flags
      - Bwd URG Flags
      - FIN Flag Count
      - SYN Flag Count
      - RST Flag Count
      - PSH Flag Count
      - ACK Flag Count
      - URG Flag Count
      - CWE Flag Count
      - ECE Flag Count

  bulk_transfer_bytes:
    template: *non_negative_float
    unit: byte
    features:
      - Fwd Avg Bytes/Bulk
      - Bwd Avg Bytes/Bulk

  bulk_transfer_packets:
    template: *non_negative_float
    unit: packet
    features:
      - Fwd Avg Packets/Bulk
      - Bwd Avg Packets/Bulk

  bulk_transfer_rate:
    template: *non_negative_float
    unit: rate
    features:
      - Fwd Avg Bulk Rate
      - Bwd Avg Bulk Rate

  dst_port_behavior_counts:
    template: *non_negative_integer
    unit: count
    features:
      - dst_port_unique_cnt

  dst_port_sequentiality:
    template: *ratio_0_1
    unit: ratio
    features:
      - dst_port_sequentiality

  entropy_stats:
    template: *non_negative_float
    unit: bits
    features:
      - dst_port_entropy

  ttl_statistics:
    template: *ttl_float
    unit: hop
    features:
      - TTL Fwd Mean
      - TTL Fwd Std
      - TTL Bwd Mean
      - TTL Bwd Std

  ttl_bounds:
    template: *ttl_int
    unit: hop
    features:
      - TTL Fwd Min
      - TTL Fwd Max
      - TTL Bwd Min
      - TTL Bwd Max

  tcp_window_statistics:
    template: *tcp_window_float
    unit: byte
    features:
      - TCP Window Fwd Mean
      - TCP Window Fwd Std
      - TCP Window Bwd Mean
      - TCP Window Bwd Std

  tcp_window_bounds:
    template: *tcp_window
    unit: byte
    features:
      - TCP Window Fwd Min
      - TCP Window Fwd Max
      - TCP Window Bwd Min
      - TCP Window Bwd Max

  fragmentation_count:
    template: *non_negative_integer
    unit: count
    features:
      - Fragmentation Count

  fragmentation_offset:
    template: *tcp_window_float
    unit: byte
    features:
      - Fragmentation Offset Mean
      - Fragmentation Offset Max

  payload_statistics:
    template: *packet_length
    unit: byte
    features:
      - Payload Mean
      - Payload Std
      - Payload Median
      - Payload P25
      - Payload P75

  payload_bounds:
    template: *payload_int
    unit: byte
    features:
      - Payload Min
      - Payload Max

  retransmission:
    template: *non_negative_integer
    unit: count
    features:
      - Retransmission Count


non_numeric_features:

  Flow ID:
    dtype: string
    validation: {}

  Source IP:
    dtype: string
    validation: {}

  Destination IP:
    dtype: string
    validation: {}

  Timestamp:
    dtype: string
    format: "%d/%m/%Y %H:%M:%S"
    validation:
      allow_nan: false

  Label:
    dtype: string
    validation: {}